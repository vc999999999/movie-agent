prompt_language: en
max_prompt_chars: 1800
motion_style: natural_sentence
supports_negative_prompt: true
quality_triggers: "cinematic film lighting, photorealistic, 4k resolution, fluid natural movement, high dynamic range"
defaults:
  steps: 30
  cfg: 6.0
default_negative_prompts:
  - "jitter, flickering, morphing limbs, distorted faces, sudden jump cut, static photo, low frame rate, blurry"
